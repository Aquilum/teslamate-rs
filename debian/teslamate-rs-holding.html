<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="5">
  <title>teslamate-rs</title>
  <style>
    :root {
      --bg: #111217;
      --panel: #181b21;
      --border: #2a2e38;
      --text: #d8dde8;
      --muted: #8b93a7;
      --accent: #e85d04;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 ui-sans-serif, system-ui, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main {
      width: min(440px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 28px 24px;
      border-radius: 8px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 18px;
      letter-spacing: 0.04em;
      color: var(--accent);
    }
    p { color: var(--muted); margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>teslamate-rs</h1>
    <p>Unavailable while it starts, or while maintenance is in progress. This page tries again every few seconds.</p>
  </main>
</body>
</html>
