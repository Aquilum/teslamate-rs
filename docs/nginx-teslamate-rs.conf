# teslamate-rs behind nginx TLS (same pattern as AstonMate).
# Keep teslamate-rs on 127.0.0.1:4010. Forward Host and X-Forwarded-Proto so
# session cookies are Secure and passkeys match the public origin.
#
# Pin passkeys with /etc/default/teslamate-rs:
#   TESLAMATE_RS_TRUST_PROXY=1
#   TESLAMATE_RS_WEBAUTHN_ORIGIN=https://tm.example.com
#   TESLAMATE_RS_WEBAUTHN_RP_ID=tm.example.com
#
# X-Forwarded-Proto / X-Real-IP are honored only with TRUST_PROXY=1 and only
# from loopback peers. X-Forwarded-Host is ignored; set Host to the public
# hostname (or pin TESLAMATE_RS_WEBAUTHN_ORIGIN).

# limit_req_zone $binary_remote_addr zone=teslamate_auth:10m rate=8r/m;

server {
    listen 443 ssl http2;
    server_name tm.example.com;

    # Static page from the package while teslamate-rs is stopped or still binding.
    # /usr/share/teslamate-rs/holding.html retries every 5 seconds.
    error_page 502 503 =200 /holding.html;

    location = /holding.html {
        internal;
        root /usr/share/teslamate-rs;
        add_header Cache-Control "no-store";
    }

    location /api/auth/ {
        limit_req zone=teslamate_auth burst=8 nodelay;
        proxy_pass http://127.0.0.1:4010;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:4010;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
